name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Run by hand to publish a release of the chosen branch: the tag (e.g. v0.1.0-alpha.1) is created on its commit
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create, e.g. v0.1.0-alpha.1 (a suffix makes it a pre-release)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test tests/PokemonManager.Tests -c Release

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install Pillow (PC box art)
        run: python3 -m pip install --user pillow

      - name: Build pak
        run: scripts/build-pak.sh
        env:
          # the release tag the pak records for its Update menu (release runs only)
          PKMGR_RELEASE: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'dev' }}

      - uses: actions/upload-artifact@v4
        with:
          name: PokemonManager
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true
          # v0.1.0-alpha.1 and the like are marked as pre-releases
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
